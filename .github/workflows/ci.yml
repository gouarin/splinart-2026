name: ci

on:
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest

        steps:
            - uses: actions/checkout@v3

            - uses: prefix-dev/setup-pixi@v0.9.6
              with:
                  cache: true

            - name: Run tests
              run: pixi run pytest
